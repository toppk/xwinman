name: Publish to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London   # directory listings print file times on the original server's clock
    steps:
      - uses: actions/checkout@v7
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.1'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install -q pyyaml
      - name: Unpack the icon, texture and tile collections
        run: python3 tools/migrate.py collections
      - uses: actions/configure-pages@v6
      - name: Build  # every link on the site is relative, so the base URL does not matter
        run: hugo
      # what actions/upload-pages-artifact does, minus the `tar -v` that lists every file in the log
      - name: Archive the site
        run: tar --dereference --hard-dereference -C public -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github --exclude='.[^/]*' .
      - uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
